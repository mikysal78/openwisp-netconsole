name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check openwisp_netconsole/static/openwisp_netconsole/netconsole.js
      - name: Italian translation (.po valid and .mo up to date)
        run: |
          sudo apt-get install -y -qq gettext
          cd openwisp_netconsole/locale/it/LC_MESSAGES
          msgfmt -c -o /tmp/django.mo django.po
          cmp /tmp/django.mo django.mo

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest jinja2 "django~=5.2.0" openwisp-utils requests
      - name: Tests
        run: pytest -v
      - name: Migrations match the models
        env:
          PYTHONPATH: .
          DJANGO_SETTINGS_MODULE: ci.settings
        run: django-admin makemigrations openwisp_netconsole --check --dry-run

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit .
      # The package itself has no dependencies of its own besides
      # openwisp-controller: vulnerabilities in the OpenWISP stack are
      # reported in the job summary (and by Dependabot) without failing CI,
      # since they are fixed by upgrading OpenWISP, not this package.
      - name: Known vulnerabilities in the OpenWISP stack (report)
        run: |
          {
            echo "## pip-audit (OpenWISP stack)"
            echo '```'
            pip-audit --progress-spinner off 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! pip-audit --progress-spinner off >/dev/null 2>&1; then
            echo "::warning::pip-audit found known vulnerabilities in the OpenWISP stack: see the job summary"
          fi

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ansible ansible-lint jinja2
      - run: ansible-galaxy role install openwisp.openwisp2
      - name: Playbook syntax
        working-directory: examples/ansible
        run: |
          printf '[openwisp2]\nlocalhost\n' > /tmp/hosts
          ansible-playbook --syntax-check -i /tmp/hosts playbook.yml
      - name: ansible-lint
        working-directory: examples/ansible
        run: ansible-lint playbook.yml
      - name: Generated rsyslog configuration is valid
        run: |
          sudo apt-get install -y -qq rsyslog
          python - <<'PY'
          import jinja2
          t = open("examples/ansible/templates/rsyslog-router-logs.conf.j2").read()
          conf = jinja2.Template(t).render(
              ansible_managed="ci", router_logs_dir="/tmp/router-logs", router_logs_group="adm",
              router_logs_syslog_port=10514, router_logs_netconsole_port=16666,
          )
          open("/tmp/router-logs.conf", "w").write(conf)
          PY
          rsyslogd -N1 -f /tmp/router-logs.conf

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - name: Wheel contents
        run: python ci/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
