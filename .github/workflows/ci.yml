name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check openwisp_netconsole/static/openwisp_netconsole/netconsole.js
      - name: Italian translation (.po valid and .mo up to date)
        run: |
          sudo apt-get install -y -qq gettext
          cd openwisp_netconsole/locale/it/LC_MESSAGES
          msgfmt -c -o /tmp/django.mo django.po
          cmp /tmp/django.mo django.mo

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest "django~=5.2.0" openwisp-utils requests
      - name: Tests
        run: pytest -v
      - name: Migrations match the models
        env:
          PYTHONPATH: .
          DJANGO_SETTINGS_MODULE: ci.settings
        run: django-admin makemigrations openwisp_netconsole --check --dry-run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - name: Wheel contents
        run: python ci/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
