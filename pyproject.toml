[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openwisp-netconsole"
dynamic = ["version"]
description = "Netconsole tab on the OpenWISP device page (real-time router kernel logs) and router log rotation settings"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Michele Salerno" }]
requires-python = ">=3.10"
dependencies = ["openwisp-controller>=1.1"]
classifiers = [
    "Framework :: Django",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/mikysal78/openwisp-netconsole"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["openwisp_netconsole*"]

[tool.setuptools.dynamic]
version = { attr = "openwisp_netconsole.__version__" }

[tool.setuptools.package-data]
openwisp_netconsole = [
    "templates/admin/openwisp_netconsole/device/*.html",
    "static/openwisp_netconsole/*",
    "locale/*/LC_MESSAGES/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"openwisp_netconsole/migrations/*" = ["E501"]
